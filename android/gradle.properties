org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
# Kotlin's incremental-compilation cache computes relative paths between the
# pub cache (C:) and this project (D:) — different drive roots make that
# throw ("this and base files have different roots"), corrupting the cache
# and failing the next build. Disabling incremental compilation avoids it.
kotlin.incremental=false
